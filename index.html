<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Premium Google Login Demo</title>
  <meta name="description" content="A sleek, client‑side Google login implementation with modern design and smooth micro‑animations.">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <main class="centered">
    <section class="login-card">
      <h1>Welcome</h1>
      <div id="g_id_onload"
           data-client_id="390652157127-e0o25dk5kd8j2qf4d8jkervg5g4j387v.apps.googleusercontent.com"
           data-context="signin"
           data-ux_mode="popup"
           data-callback="handleCredentialResponse"
           data-auto_prompt="false">
      </div>
      <div class="g_id_signin"
           data-type="standard"
           data-size="large"
           data-theme="outline"
           data-text="signin_with"
           data-shape="rectangular"
           data-logo_alignment="left">
      </div>
      <div id="user-info" class="hidden">
        <img id="user-pic" src="" alt="User picture" />
        <p id="user-name"></p>
        <button id="signout" class="button-outline">Sign out</button>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
